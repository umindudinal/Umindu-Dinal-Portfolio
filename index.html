<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.avif" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Umindu Dinal | Portfolio</title>
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('umindu_theme');
          const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          const theme = savedTheme ? savedTheme : (prefersLight ? 'light' : 'dark');
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-dark-100 text-gray-200 transition-colors duration-300 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
